apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: final-devops}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
    - job_name: final-devops-api
      static_configs:
      - targets: [final-devops-api.final-devops.svc.cluster.local:80]
      metrics_path: /metrics

services:
  api:
    build: {context: .., dockerfile: docker/Dockerfile}
    ports: ["8080:8080"]
    environment: {APP_ENV: docker, APP_VERSION: local, LOG_LEVEL: INFO, DATABASE_URL: postgresql://example:example@db:5432/example}
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: example, POSTGRES_USER: example, POSTGRES_PASSWORD: example}
    volumes: [postgres_data:/var/lib/postgresql/data]
volumes: {postgres_data: {}}

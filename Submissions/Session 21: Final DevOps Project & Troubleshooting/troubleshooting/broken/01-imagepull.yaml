apiVersion: apps/v1
kind: Deployment
metadata: {name: broken-image}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-image}}
  template:
    metadata: {labels: {app: broken-image}}
    spec:
      containers: [{name: api, image: ghcr.io/OWNER/does-not-exist:broken, ports: [{containerPort: 8080}]}]

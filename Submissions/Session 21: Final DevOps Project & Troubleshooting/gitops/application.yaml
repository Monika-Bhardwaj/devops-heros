apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: final-devops, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/final-devops-project.git
    targetRevision: main
    path: helm/final-devops
  destination: {server: https://kubernetes.default.svc, namespace: final-devops}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]

replicaCount: 2
image: {repository: ghcr.io/OWNER/final-devops-project, tag: latest, pullPolicy: IfNotPresent}
service: {type: ClusterIP, port: 80, targetPort: 8080}
ingress: {enabled: true, className: nginx, host: final-devops.local}
resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70}
config: {APP_ENV: kubernetes, APP_VERSION: "1.0.0", LOG_LEVEL: INFO}
secret: {DATABASE_URL: postgresql://example:change-me@postgres:5432/example}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: final-devops-api, namespace: final-devops}
spec:
  ingressClassName: nginx
  rules:
  - host: final-devops.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: final-devops-api, port: {number: 80}}}

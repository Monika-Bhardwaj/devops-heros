name: CI
on: {push: {branches: [main]}, pull_request: {}}
permissions: {contents: read, packages: write, security-events: write}
env: {IMAGE: ghcr.io/${{ github.repository }}}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: "3.12"}
    - run: pip install -r application/requirements.txt
    - run: pytest -q application
  sast:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: semgrep/semgrep-action@v1
      with: {config: p/python}
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: gitleaks/gitleaks-action@v2
      env: {GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: aquasecurity/trivy-action@0.28.0
      with: {scan-type: fs, scan-ref: ., scanners: vuln,secret, severity: HIGH,CRITICAL, exit-code: "1"}
  helm-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - run: helm lint helm/final-devops
  docker:
    needs: [test,sast,secret-scan,dependency-scan,helm-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with: {registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }}}
    - uses: docker/build-push-action@v6
      with: {context: ., file: docker/Dockerfile, push: true, tags: ${{ env.IMAGE }}:latest}
  image-scan:
    needs: docker
    runs-on: ubuntu-latest
    steps:
    - uses: aquasecurity/trivy-action@0.28.0
      with: {image-ref: ${{ env.IMAGE }}:latest, severity: HIGH,CRITICAL, exit-code: "1"}

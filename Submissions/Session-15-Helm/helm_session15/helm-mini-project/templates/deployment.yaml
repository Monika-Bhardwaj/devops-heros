apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-session15-demo.fullname" . }}
  labels:
    {{- include "helm-session15-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "helm-session15-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helm-session15-demo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Values.app.version | quote }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.greeting.enabled }}
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
          {{- end }}
      {{- if .Values.greeting.enabled }}
      volumes:
        - name: html
          configMap:
            name: {{ include "helm-session15-demo.fullname" . }}-html
      {{- end }}
